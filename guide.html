<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-Semester Checklist</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f9;
      color: #1f2937;
      padding: 24px;
      line-height: 1.6;
    }
    h1 {
      font-size: 20px;
      color: #0f766e;
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Pre-Semester Preparation Checklist</h1>
  <ul>
    <li><input type="checkbox" /> <span>Review course syllabus and credit structure</span></li>
    <li><input type="checkbox" /> <span>Check prerequisite topics from previous semesters</span></li>
    <li><input type="checkbox" /> <span>Set up required tools, compilers, or software</span></li>
    <li><input type="checkbox" /> <span>Collect reference books and lab guidelines</span></li>
    <li><input type="checkbox" /> <span>Plan weekly study and lab practice hours</span></li>
  </ul>
</body>
</html>
